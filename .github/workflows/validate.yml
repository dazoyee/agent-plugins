name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate marketplace and plugins
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          for p in plugins/*/; do
            npx -y @anthropic-ai/claude-code plugin validate "$p"
          done
      - name: Validate JSON manifests
        run: |
          for f in .agents/plugins/marketplace.json plugins/*/.codex-plugin/plugin.json; do
            [ -f "$f" ] && jq empty "$f"
          done
      - name: Check Codex skills paths
        run: |
          for m in plugins/*/.codex-plugin/plugin.json; do
            dir=$(dirname "$(dirname "$m")")
            jq -r 'if (.skills|type) == "array" then .skills[] else .skills end' "$m" | while read -r s; do
              [ -f "$dir/$s/SKILL.md" ] || [ -d "$dir/$s" ] || { echo "missing: $dir/$s"; exit 1; }
            done
          done
